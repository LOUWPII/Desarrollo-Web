<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda JS</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Encabezado con logo, título y contenedor del carrito -->
    <header class="encabezado">
        <div class="contenedor-logo">
            <span class="logo">🛍️ Mi Tienda</span>
        </div>

        <div class="contenedor-carrito">
            <button id="icono-carrito" class="icono-carrito">🛒</button>

            <!-- Desplegable del carrito que se muestra con hover -->
            <div id="desplegable-carrito" class="desplegable-carrito oculto">
                <table id="tabla-carrito">
                    <thead>
                        <tr>
                            <th>Imagen</th>
                            <th>Nombre</th>
                            <th>Precio</th>
                            <th>Cantidad</th>
                        </tr>
                    </thead>
                    <tbody id="items-carrito">
                        <!-- Los ítems del carrito se insertarán dinámicamente con JS -->
                    </tbody>
                </table>
                <button id="btn-vaciar-carrito" class="btn-peligro">Vaciar carrito</button>
            </div>
        </div>
    </header>

    <main>
        <!-- Sección de introducción al negocio -->
        <section class="portada">
            <div class="portada-texto">
                <h1>Bienvenido a the book store</h1>
                <p>Descubre los mejores productos al mejor precio. ¡Agrega tus favoritos al carrito!</p>
            </div>
    
            <div class="portada-imagen">
                <img src="https://miro.medium.com/v2/resize:fit:1400/1*S81O15rjKfG-BFdnNC6-GQ.jpeg" alt="negocio">
            </div>
        </section>

        <!-- Sección de productos -->
        <section class="seccion-tienda">
            <h2>TIENDA</h2>
            <div id="contenedor-productos" class="grilla-productos">
                <!-- Tarjetas de productos generadas dinámicamente -->
            </div>
        </section>
        <br>
        <!-- Sección del formulario para agregar productos -->
        <section class="seccion-agregar-producto">
            <h2>AGREGAR ARTÍCULO</h2>
            <br>
            <form id="formulario-agregar-producto" class="formulario-producto">
                <div class="grupo-formulario">
                    <label for="nombre-producto">Nombre del artículo:</label>
                    <input type="text" id="nombre-producto" required>
                </div>

                <div class="grupo-formulario">
                    <label for="atributo-1">Categoría (Atributo 1):</label>
                    <input type="text" id="atributo-1" required>
                </div>

                <div class="grupo-formulario">
                    <label for="atributo-2">Marca (Atributo 2):</label>
                    <input type="text" id="atributo-2" required>
                </div>

                <div class="grupo-formulario">
                    <label for="atributo-3">Garantía (Atributo 3):</label>
                    <input type="text" id="atributo-3" required>
                </div>

                <div class="grupo-formulario">
                    <label for="imagen-producto">Imagen (URL):</label>
                    <input type="url" id="imagen-producto" placeholder="https://via.placeholder.com/150" required>
                </div>

                <div class="grupo-formulario">
                    <label for="precio-producto">Precio:</label>
                    <input type="number" id="precio-producto" required min="0">
                </div>

                <button type="submit" id="btn-agregar-producto">Agregar artículo</button>
            </form>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
